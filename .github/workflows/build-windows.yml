name: Build Windows exe

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'cursor/**'
    paths:
      - '.github/workflows/build-windows.yml'
      - '統合ネームラベル/ソース/**'
      - 'THIRD_PARTY_NOTICES.md'
      - 'README.md'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/build-windows.yml'
      - '統合ネームラベル/ソース/**'
      - 'THIRD_PARTY_NOTICES.md'
      - 'README.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build with ビルド.ps1
        shell: pwsh
        run: |
          Set-Location -LiteralPath '統合ネームラベル/ソース'
          & '.\ビルド.ps1'

      - name: Verify barcodes (ZXing)
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'barcode-verify'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $exe = (Resolve-Path -LiteralPath '.\統合ネームラベル\統合ネームラベル.exe').Path
          # WinExe は & 実行だと $LASTEXITCODE が null になり得るため Start-Process で終了コードを取る
          $proc = Start-Process -FilePath $exe -ArgumentList @('--verify-barcode', $out) -Wait -PassThru -NoNewWindow
          $err = Join-Path $out 'error.txt'
          $ok = Join-Path $out 'barcode-verification.txt'
          if ($proc.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $err) { Get-Content -LiteralPath $err -Encoding UTF8 | Write-Host }
            throw "barcode verification failed (exit=$($proc.ExitCode))"
          }
          if (!(Test-Path -LiteralPath $ok)) { throw 'barcode-verification.txt was not written' }
          Get-Content -LiteralPath $ok -Encoding UTF8


      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: togo-name-label-windows
          path: |
            統合ネームラベル/統合ネームラベル.exe
            統合ネームラベル/統合ネームラベル.exe.config
            統合ネームラベル/zxing.dll
            統合ネームラベル/DotNetBarcode.dll
          if-no-files-found: error
