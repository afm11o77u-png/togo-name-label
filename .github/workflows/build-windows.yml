name: Build Windows exe

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'cursor/**'
    paths:
      - '.github/workflows/build-windows.yml'
      - '統合ネームラベル/ソース/**'
      - 'THIRD_PARTY_NOTICES.md'
      - 'README.md'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/build-windows.yml'
      - '統合ネームラベル/ソース/**'
      - 'THIRD_PARTY_NOTICES.md'
      - 'README.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with ビルド.ps1
        shell: pwsh
        run: |
          Set-Location -LiteralPath '統合ネームラベル/ソース'
          & '.\ビルド.ps1'

      - name: Verify barcodes (ZXing)
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'barcode-verify'
          & '.\統合ネームラベル\統合ネームラベル.exe' --verify-barcode $out
          if ($LASTEXITCODE -ne 0) { throw 'barcode verification failed' }
          Get-Content -LiteralPath (Join-Path $out 'barcode-verification.txt') -Encoding UTF8

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: togo-name-label-windows
          path: |
            統合ネームラベル/統合ネームラベル.exe
            統合ネームラベル/統合ネームラベル.exe.config
            統合ネームラベル/zxing.dll
            統合ネームラベル/DotNetBarcode.dll
          if-no-files-found: error
