name: Build Windows exe

on:
  workflow_dispatch:
    inputs:
      commit_artifacts:
        description: Commit built exe/config back to the triggering branch
        type: boolean
        default: true
  push:
    branches:
      - 'cursor/publish-built-exe-*'
      - 'cursor/ben-gama-excel-realign-9ee6'
      - 'cursor/ben-gama-align-scale-9ee6'
      - 'cursor/generic-row-position-5a78'
      - 'cursor/generic-autofit-defaults-5a78'
      - 'cursor/dan-size-two-row-a8df'
      - 'cursor/customer-type-filter-6f83'
      - 'cursor/customer-name-input-7b59'
      - 'cursor/remove-picker-star-7b59'
      - 'cursor/dan-size-align-update-914d'
      - 'cursor/dan-size-resync-cc4d'
      - 'cursor/dan-size-small-align-668a'
      - 'cursor/remove-favorite-star-7b59'
    paths:
      - '.github/workflows/build-windows.yml'
      - '統合ネームラベル/ソース/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with ビルド.ps1
        shell: pwsh
        run: |
          Set-Location -LiteralPath '統合ネームラベル/ソース'
          & '.\ビルド.ps1'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: togo-name-label-windows
          path: |
            統合ネームラベル/統合ネームラベル.exe
            統合ネームラベル/統合ネームラベル.exe.config
            統合ネームラベル/DotNetBarcode.dll
          if-no-files-found: error

      - name: Commit built artifacts to branch
        if: ${{ github.event_name == 'push' || inputs.commit_artifacts }}
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '統合ネームラベル/統合ネームラベル.exe' '統合ネームラベル/統合ネームラベル.exe.config'
          if (git diff --cached --quiet) {
            Write-Host 'No artifact changes to commit.'
            exit 0
          }
          git commit -m "Rebuild 統合ネームラベル.exe on windows-latest (includes 汎用ラベル)"
          git push origin "HEAD:$env:GITHUB_REF_NAME"
